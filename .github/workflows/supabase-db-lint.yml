name: Supabase DB Lint

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-db-lint.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      # The gate's own files are watched too, so a change to the checker or the
      # baseline actually runs the checker. Without this a broken gate could be
      # merged and only discovered at the next migration -- which is how this
      # workflow sat green-on-noop unnoticed in the first place.
      - '.github/workflows/supabase-db-lint.yml'
      - '.github/scripts/check-db-lint.py'
      - '.github/db-lint-baseline.json'

jobs:
  lint:
    name: supabase db lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED for the same reason as deploy-edge-functions.yml: CLI 2.115
      # validates the whole config.toml before running anything, including
      #   [auth.hook.send_email] secrets = "env(SEND_EMAIL_HOOK_SECRET)"
      # which is unset on the runner, so every command aborts with
      #   Invalid hook config: auth.hook.send_email.secrets must be formatted...
      # That is what failed this workflow in 12 seconds on 2026-08-20, the first
      # run after SUPABASE_ACCESS_TOKEN was added -- before then the guard below
      # exited 0 and the gate had never actually run. Reproduced locally: 2.115
      # fails, 2.109.1 lints fine.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # Runs the same PL/pgSQL linter that the migration tool runs post-apply.
      # Fails the build on any error-level finding (missing RLS, unsafe search_path, etc.).
      # This is a second gate on the PR path — the migration tool already gates on
      # the linter at apply time; this catches regressions before the migration is even proposed.
      - name: Lint migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: mstibdszibcheodvnprm
        run: |
          # FAILS rather than skipping. This guard was ::warning:: + exit 0, and
          # the secret was unset, so the gate reported success without ever
          # linting anything -- the same green-on-noop pattern that let the
          # deploy workflow ship nothing for 205 runs.
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — cannot lint. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

          # `supabase db lint` exits 0 even when it reports errors, so its exit
          # code cannot gate anything. Capture the JSON and let the checker
          # decide. set -o pipefail so a CLI crash is not masked by a passing
          # python process.
          set -o pipefail
          supabase db lint --level error | tee /tmp/db-lint.json | python3 .github/scripts/check-db-lint.py
